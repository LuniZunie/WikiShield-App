name: Build and Release

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  NODE_OPTIONS: --no-warnings

on:
  push:
    tags:
      - 'v*' # Trigger on version tags like v1.0.0
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          path: dist/**/*
          retention-days: 1

  create-release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-dist

      - name: Create Release and Upload Assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node -e "
          const fs = require('fs');
          const path = require('path');
          const { execSync } = require('child_process');

          const tag = '${{ github.ref }}'.replace('refs/tags/', '');
          const version = tag.replace('v', '');

          console.log('Creating release for tag:', tag);

          try {
            // Create release
            execSync(\`gh release create \${tag} --title \"WikiShield \${version}\" --draft=false\`, {
              stdio: 'inherit'
            });
          } catch (e) {
            // Release might already exist, continue
            console.log('Release already exists or error:', e.message);
          }

          // Upload all artifacts - only distributable files
          const artifactDir = './all-dist';
          const files = [];

          // File patterns to include
          const includePatterns = [
            /\\.exe$/,         // Windows installers
            /\\.msi$/,         // Windows MSI
            /\\.dmg$/,         // macOS installers
            /\\.zip$/,         // macOS zips
            /\\.AppImage$/,    // Linux AppImage
            /\\.deb$/,         // Linux deb
            /\\.rpm$/,         // Linux rpm
            /latest.*\\.yml$/,  // Latest metadata files
            /builder-debug\\.yml\$/ // Builder debug files
          ];

          function findFiles(dir) {
            const items = fs.readdirSync(dir);
            items.forEach(item => {
              const fullPath = path.join(dir, item);
              const stat = fs.statSync(fullPath);
              if (stat.isDirectory()) {
                findFiles(fullPath);
              } else if (includePatterns.some(p => p.test(item))) {
                files.push(fullPath);
              }
            });
          }

          findFiles(artifactDir);

          files.forEach(file => {
            console.log('Uploading:', file);
            // Use --clobber to overwrite if file already exists
            execSync(\`gh release upload \${tag} \"\${file}\" --clobber\`, {
              stdio: 'inherit',
              shell: '/bin/bash'
            });
          });

          console.log('Release created successfully!');
          console.log('View at: https://github.com/\${{ github.repository }}/releases/tag/\${tag}');
          "
