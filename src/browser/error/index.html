<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Error</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="../common/style.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100vw;
            height: 100vh;

            padding: 40px;

            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;

            /* Theme dependent */
            background: linear-gradient(135deg,
                rgba(15, 12, 41, 1),
                rgba(25, 22, 50, 1),
                rgba(36, 36, 62, 1)
            );
            color: rgba(255, 255, 255, .9);

            & > .container {
                max-width: 600px;

                text-align: center;

                & > #icon {
                    margin-bottom: 20px;

                    font-size: 64px;

                    /* Theme dependent */
                    color: rgba(240, 147, 251, .7);
                }

                & > #title {
                    margin-bottom: 10px;

                    font-size: 32px;
                    font-weight: 600;

                    /* Theme dependent */
                    color: rgba(255, 255, 255, .95);
                }
                & > #code {
                    margin-bottom: 24px;

                    font-size: 18px;
                    font-weight: 500;

                    /* Theme dependent */
                    color: rgba(102, 126, 234, 0.9);
                }
                & > #description {
                    margin-bottom: 16px;

                    font-size: 16px;
                    line-height: 1.5;

                    /* Theme dependent */
                    color: rgba(255, 255, 255, .8);
                }
                & > #url {
                    margin-bottom: 24px;
                    padding: 12px;

                    font-family: monospace;
                    font-size: 14px;
                    word-break: break-all;

                    /* Theme dependent */
                    background: rgba(255, 255, 255, .03);
                    color: rgba(255, 255, 255, .6);
                }

                & > .suggestions {
                    margin: 32px 0;
                    padding: 24px;

                    border-radius: 12px;
                    border: 1px solid;

                    text-align: left;

                    /* Theme dependent */
                    border-color: rgba(102, 126, 234, .1);

                    & > h3 {
                        margin-bottom: 16px;

                        font-size: 16px;
                        font-weight: 600;

                        /* Theme dependent */
                        color: rgba(255, 255, 255, .9);
                    }

                    & > ul {
                        list-style: none;

                        padding: none;

                        & > li {
                            position: relative;

                            padding: 8px 0 8px 24px;

                            line-height: 1.5;

                            /* Theme dependent */
                            color: rgba(255, 255, 255, .8);

                            &::before {
                                content: "\2022";

                                position: absolute;
                                left: 0;
                                top: 50%;

                                font-size: 18px;

                                transform: translateY(-50%);

                                /* Theme dependent */
                                color: rgba(102, 126, 234, .7);
                            }
                        }
                    }
                }

                & > .actions {
                    display: flex;
                    justify-content: center;
                    gap: 16px;

                    & > button {
                        display: flex;
                        align-items: center;
                        gap: 8px;

                        border: none;
                        border-radius: 8px;

                        padding: 12px 24px;

                        font-size: 14px;
                        font-weight: 600;
                        cursor: pointer;

                        transition: background 0.2s,
                                    color 0.2s,
                                    transform 0.1s;

                        &:active {
                            transform: scale(0.98);
                        }

                        &.primary {
                            /* Theme dependent */
                            background: rgba(102, 126, 234, .9);
                            color: rgba(255, 255, 255, .95);

                            &:hover {
                                /* Theme dependent */
                                background: rgba(102, 126, 234, 1);
                            }
                        }

                        &.secondary {
                            /* Theme dependent */
                            background: rgba(255, 255, 255, .05);
                            color: rgba(255, 255, 255, .8);

                            &:hover {
                                /* Theme dependent */
                                background: rgba(255, 255, 255, .1);
                            }
                        }
                    }
                }
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="icon"></div>
        <h1 id="title"></h1>
        <div id="code"></div>
        <div id="description"></div>
        <div id="url"></div>

        <div class="suggestions">
            <h3>Try the following:</h3>
            <ul id="suggestions-list"></ul>
        </div>

        <div class="actions">
            <button type="button" class="primary" onclick="location.reload()">
                <i class="fas fa-rotate-right"></i>
                Reload Page
            </button>
            <button type="button" class="secondary" onclick="history.back()">
                <i class="fas fa-arrow-left"></i>
                Go Back
            </button>
        </div>
    </div>

    <script>
        class ErrorPage {
            static get CONFIGS() {
                return {
                    "ERR_NAME_NOT_RESOLVED": {
                        title: "Website Not Found",
                        icon: "fa-triangle-exclamation",
                        description: "The website address couldn't be found. This might be because the website doesn't exist or there's a typo in the address.",
                        suggestions: [
                            "Check the web address for typos",
                            "Verify your internet connection is working",
                            "Try searching for the website instead",
                            "The website might no longer exist"
                        ]
                    },
                    "ERR_CONNECTION_REFUSED": {
                        title: "Connection Refused",
                        icon: "fa-plug-circle-xmark",
                        description: "The website refused to connect. The server might be down or blocking connections.",
                        suggestions: [
                            "The website server might be temporarily down",
                            "Check if the website is accessible from other devices",
                            "Try again later",
                            "Contact the website administrator if this persists"
                        ]
                    },
                    "ERR_CONNECTION_TIMED_OUT": {
                        title: "Connection Timed Out",
                        icon: "fa-clock",
                        description: "The connection took too long to respond. The server might be slow or unreachable.",
                        suggestions: [
                            "Check your internet connection",
                            "The server might be experiencing high traffic",
                            "Try refreshing the page",
                            "Try again in a few minutes"
                        ]
                    },
                    "ERR_INTERNET_DISCONNECTED": {
                        title: "No Internet Connection",
                        icon: "fa-wifi-slash",
                        description: "You're not connected to the internet. Check your network connection.",
                        suggestions: [
                            "Check if your device is connected to WiFi or Ethernet",
                            "Try restarting your router",
                            "Check if other devices can connect",
                            "Contact your internet service provider if needed"
                        ]
                    },
                    "ERR_CERT_AUTHORITY_INVALID": {
                        title: "Security Certificate Invalid",
                        icon: "fa-shield-halved",
                        description: "The website's security certificate is not trusted. This might be a security risk.",
                        suggestions: [
                            "The website's security certificate may have expired",
                            "Your computer's date and time might be incorrect",
                            "Avoid entering sensitive information",
                            "Contact the website administrator"
                        ]
                    },
                    "ERR_CERT_DATE_INVALID": {
                        title: "Certificate Date Invalid",
                        icon: "fa-calendar-xmark",
                        description: "The website's security certificate has expired or is not yet valid.",
                        suggestions: [
                            "Check your computer's date and time settings",
                            "The website's certificate may have expired",
                            "Avoid entering sensitive information",
                            "Contact the website administrator"
                        ]
                    },
                    "ERR_SSL_PROTOCOL_ERROR": {
                        title: "SSL Protocol Error",
                        icon: "fa-lock-open",
                        description: "An error occurred during the secure connection process.",
                        suggestions: [
                            "The website might not support secure connections properly",
                            "Try clearing your browser cache",
                            "Try accessing the website later",
                            "Contact the website administrator"
                        ]
                    },
                    "ERR_ABORTED": {
                        title: "Connection Aborted",
                        icon: "fa-circle-xmark",
                        description: "The connection was aborted before the page could load.",
                        suggestions: [
                            "Try refreshing the page",
                            "Check your internet connection",
                            "The request might have been blocked",
                            "Try accessing the page again"
                        ]
                    },
                    "ERR_FAILED": {
                        title: "Connection Failed",
                        icon: "fa-circle-exclamation",
                        description: "The connection failed for an unknown reason.",
                        suggestions: [
                            "Try refreshing the page",
                            "Check your internet connection",
                            "Clear your browser cache",
                            "Try again later"
                        ]
                    }
                };
            }

            constructor(params) {
                this.code = params.get("code") || "ERR_FAILED";
                this.url = params.get("url") || "";
                this.description = params.get("description") || "";
            }

            init() {
                const config = ErrorPage.CONFIGS[this.code];

                document.querySelector("#icon").innerHTML = `<i class="fas ${config.icon}"></i>`;
                document.querySelector("#title").textContent = config.title;
                document.querySelector("#code").textContent = this.code;
                document.querySelector("#description").textContent = this.description || config.description;
                document.querySelector("#suggestions-list").innerHTML = config.suggestions.map(s => `<li>${s}</li>`).join("");

                const $url = document.querySelector("#url");
                if (this.url)
                    $url.textContent = this.url;
                else
                    $url.style.display = "none";
            }
        }

        new ErrorPage(new URLSearchParams(location.search)).init();
    </script>
</body>
</html>
