<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Tab</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.0/css/all.min.css">
    <style>
        :root {
            --max-z-index: 2147483647;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        ::-webkit-scrollbar {
            width: 12px;
        }

        ::-webkit-scrollbar-track {
            /* Theme dependent */
            background: rgba(0, 0, 0, .2);
        }

        ::-webkit-scrollbar-thumb {
            border-radius: 6px;
            border: 2px solid;

            /* Theme dependent */
            background: rgba(102, 126, 234, .4);
            border-color: rgba(0, 0, 0, .2);

            &:hover {
                /* Theme dependent */
                background: rgba(102, 126, 234, .6);
            }
        }

        body {
            width: 100vw;
            height: 100vh;

            padding: 40px 20px;

            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            overflow: hidden auto;

            /* Theme dependent */
            background: linear-gradient(135deg,
                rgba(15, 12, 41, 1),
                rgba(25, 22, 50, 1),
                rgba(36, 36, 62, 1)
            );
            color: rgba(255, 255, 255, .9);

            & > .container {
                max-width: 900px;

                position: relative;
                top: 50%;

                margin: 0 auto;

                transform: translateY(-50%);

                & > .header {
                    margin-bottom: 50px;

                    text-align: center;

                    & > .logo {
                        width: 100px;
                        height: 100px;
                        margin: 0 auto 15px;

                        filter: drop-shadow(0 4px 8px rgba(0, 0, 0, .3));

                        & > img {
                            object-fit: contain;
                            width: 100%;
                            height: 100%;
                        }
                    }

                    & > .title {
                        margin-bottom: 10px;

                        font-size: 32px;
                        font-weight: 600;

                        /* Theme dependent */
                        background: linear-gradient(135deg,
                            rgba(102, 126, 234, 1),
                            rgba(118, 75, 162, 1)
                        );
                        -webkit-background-clip: text;
                                background-clip: text;
                        -webkit-text-fill-color: transparent;
                    }

                    & > .subtitle {
                        font-size: 16px;
                        font-weight: 300;

                        /* Theme dependent */
                        color: rgba(255, 255, 255, .6);
                    }
                }

                & > #clock {
                    margin-bottom: 30px;

                    font-size: 48px;
                    font-weight: 200;
                    text-align: center;

                    /* Theme dependent */
                    color: rgba(255, 255, 255, .9);
                }

                & > .search-section {
                    margin-bottom: 50px;

                    & > .search-box {
                        max-width: 600px;

                        margin: 0 auto;

                        position: relative;

                        & > #search-input {
                            width: 100%;

                            outline: none;
                            border-radius: 30px;
                            border: 2px solid;

                            padding: 16px 50px 16px 20px;

                            font-size: 16px;

                            transition: background .3s ease,
                                        border-color .3s ease,
                                        box-shadow .3s ease;

                            /* Theme dependent */
                            background: rgba(255, 255, 255, .05);
                            border-color: rgba(255, 255, 255, .1);
                            color: rgba(255, 255, 255, 1);
                            -webkit-backdrop-filter: blur(10px);
                                    backdrop-filter: blur(10px);

                            &:focus {
                                /* Theme dependent */
                                background: rgba(255, 255, 255, .08);
                                box-shadow: 0 0 20px rgba(102, 126, 234, .2);
                                border-color: rgba(102, 126, 234, .5);
                            }
                            &::placeholder {
                                /* Theme dependent */
                                color: rgba(255, 255, 255, .4);
                            }
                        }

                        & > .search-icon {
                            pointer-events: none;

                            position: absolute;
                            right: 20px;
                            top: 50%;

                            font-size: 18px;

                            opacity: .5;

                            transform: translateY(-50%);
                        }

                        & > #autocomplete-dropdown {
                            z-index: var(--max-z-index);

                            display: none;
                            max-height: 250px;

                            border-radius: 12px;
                            border: 1px solid;

                            position: absolute;
                            top: calc(100% + 8px);
                            left: 0;
                            right: 0;

                            /* Theme dependent */
                            background: rgba(15, 12, 41, .98);
                            box-shadow: 0 8px 32px rgba(0, 0, 0, .4);
                            border-color: rgba(102, 126, 234, .2);
                            -webkit-backdrop-filter: blur(20px);
                                    backdrop-filter: blur(20px);

                            &::-webkit-scrollbar {
                                width: 8px;
                            }

                            &::-webkit-scrollbar-track {
                                background: transparent;
                            }

                            &::-webkit-scrollbar-thumb {
                                /* Theme dependent */
                                background: rgba(102, 126, 234, .3);
                                border-radius: 4px;

                                &:hover {
                                    /* Theme dependent */
                                    background: rgba(102, 126, 234, .5);
                                }
                            }

                            & > .autocomplete-item {
                                cursor: pointer;

                                display: flex;
                                align-items: center;

                                padding: 10px 15px;

                                transition: background .2s ease;

                                &:not(:last-child) {
                                    border-bottom: 1px solid;

                                    /* Theme dependent */
                                    border-bottom-color: rgba(255, 255, 255, .03);
                                }

                                &:hover, &.selected {
                                    /* Theme dependent */
                                    background: rgba(102, 126, 234, .15);
                                }

                                & > i {
                                    width: 20px;

                                    margin-right: 15px;

                                    font-size: 18px;

                                    opacity: .6;
                                }

                                & > .autocomplete-text {
                                    display: flex;
                                    flex-direction: column;
                                    flex: 1;
                                    gap: 2px;

                                    overflow: hidden;

                                    & > .autocomplete-title {
                                        font-size: 14px;
                                        font-weight: 500;

                                        text-overflow: ellipsis;
                                        white-space: nowrap;
                                        overflow: hidden;

                                        /* Theme dependent */
                                        color: rgba(255, 255, 255, .9);
                                    }

                                    & > .autocomplete-url {
                                        font-size: 12px;

                                        text-overflow: ellipsis;
                                        white-space: nowrap;
                                        overflow: hidden;

                                        /* Theme dependent */
                                        color: rgba(255, 255, 255, .5);
                                    }
                                }
                            }
                        }
                    }
                }

                & > .quick-links {
                    margin-bottom: 40px;

                    & > .section-title {
                        margin-bottom: 20px;
                        padding-left: 5px;

                        font-size: 20px;
                        font-weight: 500;

                        /* Theme dependent */
                        color: rgba(255, 255, 255, .8);
                    }

                    & > .links-grid {
                        display: grid;
                        grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
                        gap: 15px;

                        & > .link-card {
                            cursor: pointer;

                            display: block;

                            border: 1px solid;
                            border-radius: 12px;

                            padding: 20px;

                            text-align: center;
                            text-decoration: none;
                            color: inherit;

                            transition: background .3s ease,
                                        border-color .3s ease,
                                        transform .3s ease,
                                        box-shadow .3s ease;

                            /* Theme dependent */
                            background: rgba(255, 255, 255, .05);
                            border-color: rgba(255, 255, 255, .1);

                            &:hover {
                                transform: translateY(-3px);

                                /* Theme dependent */
                                background: rgba(255, 255, 255, .08);
                                border-color: rgba(102, 126, 234, .5);
                                box-shadow: 0 5px 20px rgba(0, 0, 0, .3);
                            }

                            & > .link-icon {
                                margin-bottom: 10px;

                                font-size: 36px;
                            }

                            & > .link-title {
                                font-weight: 500;

                                font-size: 14px;
                            }
                        }
                    }
                }

                & > .footer {
                    margin-top: 40px;

                    font-size: 14px;
                    text-align: center;

                    /* Theme dependent */
                    color: rgba(255, 255, 255, .4);
                }
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">
                <img src="../../assets/icons/256x256.png" alt="WikiShield Logo">
            </div>
            <h1 class="title">WikiShield</h1>
            <p class="subtitle">Wikipedia vandalism detection and counter-vandalism tool</p>
        </div>

        <div class="clock" id="clock">--:--</div>

        <div class="search-section">
            <div class="search-box">
                <input
                    type="text"
                    placeholder="Search google or enter a URL..."
                    id="search-input"
                    autocomplete="off"
                >
                <i class="fas fa-search search-icon"></i>
                <div id="autocomplete-dropdown"></div>
            </div>
        </div>

        <div class="quick-links">
            <h2 class="section-title">Quick Links</h2>
            <div class="links-grid">
                <a href="https://en.wikipedia.org/wiki/Special:RecentChanges" class="link-card">
                    <div class="link-icon"><i class="fas fa-clock"></i></div>
                    <div class="link-title">Recent Changes</div>
                </a>
                <a href="https://en.wikipedia.org/wiki/Special:Watchlist" class="link-card">
                    <div class="link-icon"><i class="fas fa-bookmark"></i></div>
                    <div class="link-title">Watchlist</div>
                </a>
                <a href="https://en.wikipedia.org" class="link-card">
                    <div class="link-icon"><i class="fab fa-wikipedia-w"></i></div>
                    <div class="link-title">Wikipedia</div>
                </a>
                <a href="https://en.wikipedia.org/wiki/Special:MyContributions" class="link-card">
                    <div class="link-icon"><i class="fas fa-edit"></i></div>
                    <div class="link-title">Contributions</div>
                </a>
                <a href="https://en.wikipedia.org/wiki/Special:Log" class="link-card">
                    <div class="link-icon"><i class="fas fa-list-alt"></i></div>
                    <div class="link-title">Logs</div>
                </a>
            </div>
        </div>

        <div class="footer">
            <p>WikiShield Browser &copy; 2026 LuniZunie.</p>
        </div>
    </div>

    <script>
        class Memory extends Map {
            constructor(limit = 100) {
                super();
                this.limit = limit;
            }

            set(key, value) {
                if (this.size >= this.limit)
                    this.delete(this.keys().next().value);
                return super.set(key, value);
            }
        }

        function UpdateClock() {
            const format = str => str.toString().padStart(2, "0");

            const now = new Date();
            document.querySelector("#clock").textContent = `${format(now.getHours())}:${format(now.getMinutes())}`;

            requestAnimationFrame(UpdateClock);
        }
        UpdateClock();

        class Autocomplete {
            static isUrl(string) {
                const urlPattern = /^(https?:\/\/)?(([a-z\d]([a-z\d-]*[a-z\d])*)\.)+[a-z]{2,}(\:[0-9]+)?(\/[-a-z\d%_.~+]*)*$/i;
                const localhostPattern = /^(https?:\/\/)?(localhost|127\.0\.0\.1)(:\d+)?/i;

                return urlPattern.test(string) || localhostPattern.test(string) || string.includes(".");
            }

            cache = new Memory(1000);
            index = -1;

            constructor($input, $dropdown) {
                this.$input = $input;
                this.$dropdown = $dropdown;

                $input.addEventListener("input", async event => {
                    const query = event.target.value.trim();
                    if (query)
                        this.show(await this.suggestions(query));
                    else
                        this.hide();
                });
                $input.addEventListener("keydown", event => {
                    const items = this.$dropdown.querySelectorAll(".autocomplete-item");

                    if (event.key === "ArrowDown") {
                        event.preventDefault();
                        this.index = Math.min(this.index + 1, items.length - 1);
                        this.update();
                    } else if (event.key === "ArrowUp") {
                        event.preventDefault();
                        this.index = Math.max(this.index - 1, -1);
                        this.update();
                    } else if (event.key === "Escape")
                        this.hide();
                });
                $input.addEventListener("keypress", event => {
                    if (event.key === "Enter") {
                        const items = this.$dropdown.querySelectorAll(".autocomplete-item");
                        if (this.index >= 0 && items[this.index]) {
                            const selectedItem = items[this.index];
                            this.navigate(selectedItem.dataset.url, selectedItem.querySelector(".autocomplete-title").textContent);
                        } else {
                            const query = this.$input.value.trim();
                            if (query)
                                this.navigate(query, query);
                        }
                        this.hide();
                    }
                });

                $input.addEventListener("focus", async () => {
                    const query = this.$input.value.trim();
                    if (query)
                        this.show(await this.suggestions(query));
                });
                $input.addEventListener("blur", () => setTimeout(() => this.hide(), 100));
            }

            async suggestions(query) {
                if (Autocomplete.isUrl(query))
                    return [ { title: query, url: query, isSearch: false } ];

                if (this.cache.has(query))
                    return this.cache.get(query);

                try {
                    const $script = document.createElement("script");
                    const callback = `autocompleteCallback_${Date.now()}`;

                    const data = await new Promise(resolve => {
                        window[callback] = data => {
                            delete window[callback];
                            $script.remove();
                            resolve(data);
                        };

                        $script.src = `https://suggestqueries.google.com/complete/search?client=firefox&q=${encodeURIComponent(query)}&callback=${callback}`;
                        document.head.appendChild($script);

                        setTimeout(() => {
                            if (window[callback]) {
                                delete window[callback];
                                $script.remove();
                                resolve([ query, [ ] ]);
                            }
                        }, 3000);
                    });

                    const suggestions = (data[1] || [ ]).map(item => ({
                        title: item,
                        url: `https://www.google.com/search?q=${encodeURIComponent(item)}`,
                        isSearch: true,
                    }));

                    this.cache.set(query, suggestions);
                    return this.cache.get(query);
                } catch (error) { return void(console.error("Failed to fetch suggestions:", error)) ?? [ ]; }
            }

            show(suggestions) {
                if (suggestions.length === 0)
                    return void(this.hide());

                this.$dropdown.innerHTML = suggestions.map((item, index) => {
                    const $item = document.createElement("div");
                    $item.className = "autocomplete-item";
                    $item.dataset.url = item.url;
                    $item.dataset.index = index;

                    const $icon = document.createElement("i");
                    $icon.className = item.isSearch ? "fas fa-magnifying-glass" : "fas fa-globe";
                    $item.appendChild($icon);

                    const $text = document.createElement("div");
                    $text.className = "autocomplete-text";
                    $item.appendChild($text);

                    const $title = document.createElement("div");
                    $title.className = "autocomplete-title";
                    $title.textContent = item.title;
                    $text.appendChild($title);

                    const $url = document.createElement("div");
                    $url.className = "autocomplete-url";
                    $url.textContent = item.isSearch ? "Search Google" : item.url;
                    $text.appendChild($url);

                    $item.addEventListener("click", () => this.navigate(item.url, item.title));

                    return $item.outerHTML;
                }).join("");
                this.$dropdown.style.display = "block";
            }

            hide() {
                this.$dropdown.style.display = "none";
                this.index = -1;
            }

            navigate(url, title) {
                if (url.startsWith("http://") || url.startsWith("https://"))
                    window.location.href = url;
                else if (title && !url.includes("."))
                    window.location.href = `https://www.google.com/search?q=${encodeURIComponent(title)}`;
                else if (url.includes("."))
                    window.location.href = `https://${url}`;
                else
                    window.location.href = `https://www.google.com/search?q=${encodeURIComponent(url)}`;
            }

            update() {
                const $items = this.$dropdown.querySelectorAll(".autocomplete-item");
                $items.forEach((item, i) => item.classList.toggle("selected", i === this.index));
                if (this.index >= 0 && $items[this.index])
                    $items[this.index].scrollIntoView({ block: "nearest" });
            }
        }

        new Autocomplete(document.querySelector("#search-input"), document.querySelector("#autocomplete-dropdown"));
    </script>
</body>
</html>
